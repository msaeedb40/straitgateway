apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: transitsegments.straitgateway.io
spec:
  group: straitgateway.io
  names:
    kind: TransitSegment
    listKind: TransitSegmentList
    plural: transitsegments
    singular: transitsegment
    shortNames: [ts]
    categories: [straitgateway]
  scope: Cluster
  versions:
    - name: v1alpha1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            apiVersion: { type: string }
            kind: { type: string }
            metadata: { type: object }
            spec:
              type: object
              required: [segmentID]
              properties:
                segmentID: { type: integer, format: int64, minimum: 1, maximum: 4294967295 }
                name: { type: string }
                cidr: { type: string }
                description: { type: string }
            status:
              type: object
              properties:
                attachedClusters: { type: integer }
                conditions: { type: array, items: { type: object, properties: { type: { type: string }, status: { type: string } } } }
      subresources:
        status: {}
      additionalPrinterColumns:
        - { name: SegmentID, type: integer, jsonPath: .spec.segmentID }
        - { name: CIDR, type: string, jsonPath: .spec.cidr }
        - { name: Age, type: date, jsonPath: .metadata.creationTimestamp }
