    - jsonPath: .status.dataplane.policyReady
      name: Policy
      type: boolean
    - jsonPath: .status.dataplane.kubeProxyReplacement
      name: KubeProxy
      type: boolean
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: NodeNetworkConfig is the per-node desired and observed network
          state managed by straitgatewayd.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: NodeNetworkConfigSpec defines the desired network state for
              a specific node.
            properties:
              ipam:
                default: PerNode
                description: IPAM defines the IP address management mode.
                enum:
                - PerNode
                - Cluster
                type: string
              mtu:
                description: MTU is the MTU configured on the node. 0 means auto-detect.
                format: int32
                maximum: 9000
                minimum: 576
                type: integer
              nodeName:
                description: NodeName is the name of the Kubernetes node this config
                  applies to.
                type: string
              overlay:
                default: Native
                description: Overlay defines the encapsulation mode for inter-node
                  pod traffic.
                enum:
                - Native
                - VXLAN
                - Geneve
                - GRE
                type: string
              podCIDRv4:
                description: PodCIDRv4 is the IPv4 pod CIDR allocated to this node
                  (discovered dynamically from node.spec.podCIDR).
                type: string
              podCIDRv6:
                description: PodCIDRv6 is the IPv6 pod CIDR allocated to this node.
                type: string
              wireGuardPublicKey:
                description: WireGuardPublicKey is the WireGuard public key for this
                  node (auto-generated by straitgatewayd).
                type: string
            required:
            - ipam
            - nodeName
            - overlay
            type: object
          status:
