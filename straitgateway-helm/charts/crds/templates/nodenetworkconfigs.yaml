                - gatewayReady
                - kubeDNSProgrammed
                - kubeProxyReplacement
                - policyReady
                - serviceReady
                type: object
              observedGeneration:
                description: ObservedGeneration is the last generation reconciled.
                format: int64
                type: integer
            type: object
