apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: bfdsessions.straitgateway.io
spec:
  group: straitgateway.io
  names:
    kind: BFDSession
    listKind: BFDSessionList
    plural: bfdsessions
    singular: bfdsession
    shortNames: [bfd]
    categories: [straitgateway]
  scope: Cluster
  versions:
    - name: v1alpha1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            apiVersion: { type: string }
            kind: { type: string }
            metadata: { type: object }
            spec:
              type: object
              required: [peerAddress]
              properties:
                peerAddress: { type: string }
                detectMultiplier: { type: integer, minimum: 1, maximum: 255, default: 3 }
                transmitInterval: { type: integer, description: "microseconds", default: 300000 }
                receiveInterval:  { type: integer, description: "microseconds", default: 300000 }
                echoMode: { type: boolean, default: false }
            status:
              type: object
              properties:
                state: { type: string, enum: [AdminDown, Down, Init, Up] }
                lastStateChange: { type: string, format: date-time }
      subresources:
        status: {}
      additionalPrinterColumns:
        - { name: Peer, type: string, jsonPath: .spec.peerAddress }
        - { name: State, type: string, jsonPath: .status.state }
        - { name: Age, type: date, jsonPath: .metadata.creationTimestamp }
