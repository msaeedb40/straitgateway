apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: bgppeers.straitgateway.io
spec:
  group: straitgateway.io
  names:
    kind: BGPPeer
    listKind: BGPPeerList
    plural: bgppeers
    singular: bgppeer
    shortNames: [bgp]
    categories: [straitgateway]
  scope: Cluster
  versions:
    - name: v1alpha1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            apiVersion: { type: string }
            kind: { type: string }
            metadata: { type: object }
            spec:
              type: object
              required: [peerAddress, peerASN, localASN]
              properties:
                peerAddress: { type: string }
                peerASN: { type: integer }
                localASN: { type: integer }
                bfdEnabled: { type: boolean }
                bfdDetectMultiplier: { type: integer }
                advertisePodCIDR: { type: boolean }
                advertiseServiceVIPs: { type: boolean }
            status:
              type: object
              properties:
                sessionState: { type: string }
                prefixesAdvertised: { type: integer }
                prefixesReceived: { type: integer }
      subresources:
        status: {}
      additionalPrinterColumns:
        - { name: Peer, type: string, jsonPath: .spec.peerAddress }
        - { name: ASN, type: integer, jsonPath: .spec.peerASN }
        - { name: State, type: string, jsonPath: .status.sessionState }
        - { name: Age, type: date, jsonPath: .metadata.creationTimestamp }
