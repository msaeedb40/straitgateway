apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: transitgateways.straitgateway.io
spec:
  group: straitgateway.io
  names:
    kind: TransitGateway
    listKind: TransitGatewayList
    plural: transitgateways
    singular: transitgateway
    shortNames: [tgw]
    categories: [straitgateway]
  scope: Cluster
  versions:
    - name: v1alpha1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            apiVersion: { type: string }
            kind: { type: string }
            metadata: { type: object }
            spec:
              type: object
              properties:
                clusterID: { type: integer }
                topology: { type: string, enum: [hub-spoke, mesh, peer-to-peer, gateway-to-gateway] }
                encryption: { type: string, enum: [wireguard, ipsec, none] }
                tunnelCIDR: { type: string }
            status:
              type: object
              properties:
                conditions: { type: array, items: { type: object, properties: { type: { type: string }, status: { type: string } } } }
      subresources:
        status: {}
      additionalPrinterColumns:
        - { name: Topology, type: string, jsonPath: .spec.topology }
        - { name: Encryption, type: string, jsonPath: .spec.encryption }
        - { name: Age, type: date, jsonPath: .metadata.creationTimestamp }
