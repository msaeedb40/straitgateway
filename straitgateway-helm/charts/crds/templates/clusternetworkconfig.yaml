apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: clusternetworkconfigs.straitgateway.io
spec:
  group: straitgateway.io
  names:
    kind: ClusterNetworkConfig
    listKind: ClusterNetworkConfigList
    plural: clusternetworkconfigs
    singular: clusternetworkconfig
    shortNames: [cnc]
    categories: [straitgateway]
  scope: Cluster
  versions:
    - name: v1alpha1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            apiVersion: { type: string }
            kind: { type: string }
            metadata: { type: object }
            spec:
              type: object
              required: [clusterName, podCIDR, serviceCIDR]
              properties:
                clusterName: { type: string }
                clusterID:   { type: integer, format: int32 }
                podCIDR:     { type: string }
                serviceCIDR: { type: string }
                kubeProxyReplacement: { type: boolean, default: true }
                mtu:         { type: integer, default: 1500 }
                encapsulation:
                  type: string
                  enum: [none, wireguard, ipsec]
                  default: none
                bgp:
                  type: object
                  properties:
                    enabled:  { type: boolean }
                    localASN: { type: integer }
            status:
              type: object
              properties:
                nodeCount:    { type: integer }
                podCount:     { type: integer }
                serviceCount: { type: integer }
                conditions:   { type: array, items: { type: object, properties: { type: { type: string }, status: { type: string } } } }
      subresources:
        status: {}
      additionalPrinterColumns:
        - { name: Cluster, type: string, jsonPath: .spec.clusterName }
        - { name: PodCIDR, type: string, jsonPath: .spec.podCIDR }
        - { name: ServiceCIDR, type: string, jsonPath: .spec.serviceCIDR }
        - { name: Age, type: date, jsonPath: .metadata.creationTimestamp }
