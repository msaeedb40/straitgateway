apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: nodenetworkconfigs.straitgateway.io
spec:
  group: straitgateway.io
  names:
    kind: NodeNetworkConfig
    listKind: NodeNetworkConfigList
    plural: nodenetworkconfigs
    singular: nodenetworkconfig
    shortNames: [nnc]
    categories: [straitgateway]
  scope: Cluster
  versions:
    - name: v1alpha1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            apiVersion: { type: string }
            kind: { type: string }
            metadata: { type: object }
            spec:
              type: object
              required: [nodeName, podCIDR]
              properties:
                nodeName: { type: string }
                podCIDR: { type: string }
                mtu: { type: integer }
                tunnelEndpoint: { type: string }
            status:
              type: object
              properties:
                allocated: { type: integer }
                available: { type: integer }
      subresources:
        status: {}
      additionalPrinterColumns:
        - { name: Node, type: string, jsonPath: .spec.nodeName }
        - { name: PodCIDR, type: string, jsonPath: .spec.podCIDR }
        - { name: Age, type: date, jsonPath: .metadata.creationTimestamp }
