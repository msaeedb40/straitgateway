apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: transitsegmentattachments.straitgateway.io
spec:
  group: straitgateway.io
  names:
    kind: TransitSegmentAttachment
    listKind: TransitSegmentAttachmentList
    plural: transitsegmentattachments
    singular: transitsegmentattachment
    shortNames: [tsa]
    categories: [straitgateway]
  scope: Namespaced
  versions:
    - name: v1alpha1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            apiVersion: { type: string }
            kind: { type: string }
            metadata: { type: object }
            spec:
              type: object
              required: [segmentRef, clusterID]
              properties:
                segmentRef:
                  type: object
                  required: [name]
                  properties:
                    name: { type: string }
                clusterID: { type: integer }
                podSelector:
                  type: object
                  properties:
                    matchLabels: { type: object, additionalProperties: { type: string } }
            status:
              type: object
              properties:
                phase: { type: string }
                conditions: { type: array, items: { type: object, properties: { type: { type: string }, status: { type: string } } } }
      subresources:
        status: {}
      additionalPrinterColumns:
        - { name: Segment, type: string, jsonPath: .spec.segmentRef.name }
        - { name: Cluster, type: integer, jsonPath: .spec.clusterID }
        - { name: Phase, type: string, jsonPath: .status.phase }
        - { name: Age, type: date, jsonPath: .metadata.creationTimestamp }
