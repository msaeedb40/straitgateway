apiVersion: v1
kind: Pod
metadata:
  name: "{{ include "straitgateway.fullname" . }}-test-connection"
  labels:
    {{- include "straitgateway.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": test
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  restartPolicy: Never
  containers:
    - name: test-connection
      image: curlimages/curl:8.7.1
      command:
        - sh
        - -c
        - |
          echo "Testing Kubernetes API connectivity..."
          curl -k -s --connect-timeout 5 https://kubernetes.default.svc/healthz || exit 1
          echo "Kubernetes API is reachable from pod networking."
