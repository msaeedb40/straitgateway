{{- if .Values.observability.metrics.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "straitgateway.fullname" . }}-controller-metrics
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "straitgateway.labels" . | nindent 4 }}
    app.kubernetes.io/component: controller
spec:
  selector:
    {{- include "straitgateway.controller.selectorLabels" . | nindent 4 }}
  ports:
    - name: metrics
      port: 9090
      targetPort: metrics
      protocol: TCP
    - name: health
      port: 8081
      targetPort: health
      protocol: TCP
  type: ClusterIP
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "straitgateway.fullname" . }}-agent-metrics
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "straitgateway.labels" . | nindent 4 }}
    app.kubernetes.io/component: agent
spec:
  selector:
    {{- include "straitgateway.agent.selectorLabels" . | nindent 4 }}
  ports:
    - name: agent-metrics
      port: 9091
      targetPort: agent-metrics
      protocol: TCP
  type: ClusterIP
{{- end }}
{{- if .Values.ui.enabled }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "straitgateway.fullname" . }}-ui
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "straitgateway.labels" . | nindent 4 }}
    app.kubernetes.io/component: ui
spec:
  selector:
    {{- include "straitgateway.ui.selectorLabels" . | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.ui.service.port }}
      targetPort: 80
      protocol: TCP
  type: {{ .Values.ui.service.type }}
{{- end }}
