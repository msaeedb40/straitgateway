{{- if .Values.controller.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: sg-controller-service
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: sg-controller
    app.kubernetes.io/part-of: straitgateway
    app.kubernetes.io/component: controller
spec:
  type: ClusterIP
  selector:
    app: sg-controller
  ports:
    - name: metrics
      port: 9090
      targetPort: 9090
      protocol: TCP
    - name: health
      port: 8081
      targetPort: 8081
      protocol: TCP
{{- end }}
