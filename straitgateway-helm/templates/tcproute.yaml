{{- if and .Values.gatewayAPI.enabled .Values.routes .Values.routes.tcp .Values.routes.tcp.enabled }}
apiVersion: gateway.networking.k8s.io/v1alpha2
kind: TCPRoute
metadata:
  name: {{ include "straitgateway.fullname" . }}-tcp
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "straitgateway.labels" . | nindent 4 }}
spec:
  parentRefs:
    - name: {{ include "straitgateway.fullname" . }}-gateway
      namespace: {{ .Release.Namespace }}
  rules:
    - backendRefs:
        - name: {{ include "straitgateway.fullname" . }}
          port: {{ .Values.service.port }}
{{- end }}
