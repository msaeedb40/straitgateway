{{- if .Values.encryption.enabled }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "straitgateway.fullname" . }}-encryption
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "straitgateway.labels" . | nindent 4 }}
type: Opaque
data:
  # Transit WireGuard / IPsec encryption keys (base64)
  # Automatically generated if omitted
  preshared-key: {{ randAlphaNum 32 | b64enc | quote }}
{{- end }}
