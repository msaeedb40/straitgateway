{{- if .Values.serviceAccount.create -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "straitgateway.serviceAccountName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "straitgateway.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
---
{{- if .Values.rbac.create }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "straitgateway.fullname" . }}
  labels:
    {{- include "straitgateway.labels" . | nindent 4 }}
rules:
  # Core Kubernetes resources
  - apiGroups: [""]
    resources:
      - nodes
      - pods
      - namespaces
      - services
      - endpoints
      - configmaps
      - secrets
      - events
    verbs: ["get", "list", "watch", "create", "update", "patch"]
  # EndpointSlices (preferred over Endpoints for scalability)
  - apiGroups: ["discovery.k8s.io"]
    resources: ["endpointslices"]
    verbs: ["get", "list", "watch"]
  # NetworkPolicy
  - apiGroups: ["networking.k8s.io"]
    resources: ["networkpolicies"]
    verbs: ["get", "list", "watch"]
  # Node status — for CIDR discovery (node.spec.podCIDR)
  - apiGroups: [""]
    resources: ["nodes/status"]
    verbs: ["get", "patch", "update"]
  # Leader election
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  # straitgateway.io CRDs
  - apiGroups: ["straitgateway.io"]
    resources:
      - straitnetworkpolicies
      - straitnetworkpolicies/status
      - transitgateways
      - transitgateways/status
      - transitsegments
      - transitsegments/status
      - transitsegmentattachments
      - transitsegmentattachments/status
      - transitsegmentroutes
      - transitsegmentroutes/status
      - bgppeers
      - bgppeers/status
      - bfdsessions
      - bfdsessions/status
      - nodenetworkconfigs
      - nodenetworkconfigs/status
      - clusternetworkconfigs
      - clusternetworkconfigs/status
    verbs: ["get", "list", "watch", "create", "update", "patch"]
  # Gateway API — full lifecycle permissions
  - apiGroups: ["gateway.networking.k8s.io"]
    resources:
      - gatewayclasses
      - gatewayclasses/status
      - gateways
      - gateways/status
      - httproutes
      - httproutes/status
      - grpcroutes
      - grpcroutes/status
      - tcproutes
      - tcproutes/status
      - tlsroutes
      - tlsroutes/status
      - udproutes
      - udproutes/status
      - referencegrants
    verbs: ["get", "list", "watch", "create", "update", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "straitgateway.fullname" . }}
  labels:
    {{- include "straitgateway.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "straitgateway.fullname" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "straitgateway.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
