version: "2"

run:
  timeout: 5m
  go: "1.26"

linters:
  enable:
    - errcheck
    - gosimple
    - govet
    - ineffassign
    - staticcheck
    - unused
    - gofmt
    - goimports
    - misspell
    - unconvert
    - unparam
    - revive
    - nilerr
    - noctx
    - bodyclose
  disable:
    - depguard

linters-settings:
  goimports:
    local-prefixes: github.com/msaeedb40/straitgateway
  revive:
    rules:
      - name: exported
        severity: warning
        arguments:
          - checkPrivateReceivers
          - sayRepetitiveInsteadOfStutters

issues:
  exclude-rules:
    - path: "_test\\.go"
      linters: [errcheck]
    - path: "hack/"
      linters: [all]
  max-issues-per-linter: 50
  max-same-issues: 10
