version: "2"

run:
  timeout: 5m
  go: "1.26.7"

linters:
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
    - misspell
    - unconvert
    - unparam
    - nilerr
    - noctx
    - bodyclose
  disable:
    - depguard
    - revive

issues:
  exclude-rules:
    - path: "_test\\.go"
      linters: [errcheck, unparam]
    - path: "cni/client\\.go"
      linters: [unparam]
    - path: "hack/"
      linters: [all]
  max-issues-per-linter: 50
  max-same-issues: 10
