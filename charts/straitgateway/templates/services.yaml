{{- if .Values.observability.metrics.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "straitgateway.fullname" . }}-metrics
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "straitgateway.labels" . | nindent 4 }}
    app.kubernetes.io/component: observability
spec:
  type: {{ .Values.observability.metrics.service.type }}
  ports:
    - name: metrics
      port: {{ .Values.observability.metrics.service.port }}
      targetPort: metrics
      protocol: TCP
  selector:
    {{- include "straitgateway.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: agent
{{- end }}
---
{{- if .Values.ui.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "straitgateway.fullname" . }}-ui
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "straitgateway.labels" . | nindent 4 }}
    app.kubernetes.io/component: ui
spec:
  type: {{ .Values.ui.service.type }}
  ports:
    - name: http
      port: {{ .Values.ui.service.port }}
      targetPort: 3000
      protocol: TCP
  selector:
    {{- include "straitgateway.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: ui
{{- end }}
