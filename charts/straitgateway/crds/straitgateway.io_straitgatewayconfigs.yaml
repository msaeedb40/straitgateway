apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: straitgatewayconfigs.straitgateway.io
spec:
  group: straitgateway.io
  names:
    kind: StraitGatewayConfig
    listKind: StraitGatewayConfigList
    plural: straitgatewayconfigs
    singular: straitgatewayconfig
    shortNames:
      - sgc
      - sgconfig
  scope: Cluster
  versions:
    - name: v1alpha1
      served: true
      storage: true
      additionalPrinterColumns:
        - name: Mode
          type: string
          jsonPath: .spec.dataplaneMode
        - name: SocketLB
          type: boolean
          jsonPath: .spec.enableSocketLb
        - name: Ready
          type: boolean
          jsonPath: .status.ready
        - name: Nodes
          type: integer
          jsonPath: .status.activeNodes
      schema:
        openAPIV3Schema:
          type: object
          properties:
            apiVersion:
              type: string
            kind:
              type: string
            metadata:
              type: object
            spec:
              type: object
              required:
                - clusterCidr
                - serviceCidr
              properties:
                clusterCidr:
                  type: string
                serviceCidr:
                  type: string
                dataplaneMode:
                  type: string
                  enum: [TCX, TC, XDP]
                tunnelType:
                  type: string
                  enum: [WireGuard, DirectRouting]
                enableSocketLb:
                  type: boolean
                enableMaglev:
                  type: boolean
                enableObservability:
                  type: boolean
            status:
              type: object
              properties:
                ready:
                  type: boolean
                activeNodes:
                  type: integer
                conditions:
                  type: array
                  items:
                    type: object
                    properties:
                      type:
                        type: string
                      status:
                        type: string
                      reason:
                        type: string
                      message:
                        type: string
                      lastTransitionTime:
                        type: string
                        format: date-time
      subresources:
        status: {}
