apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: servicemeshpolicies.straitgateway.io
spec:
  group: straitgateway.io
  names:
    kind: ServiceMeshPolicy
    listKind: ServiceMeshPolicyList
    plural: servicemeshpolicies
    singular: servicemeshpolicy
    shortNames:
      - smp
      - meshpolicy
  scope: Namespaced
  versions:
    - name: v1alpha1
      served: true
      storage: true
      additionalPrinterColumns:
        - name: Service
          type: string
          jsonPath: .spec.serviceRef
        - name: mTLS
          type: string
          jsonPath: .spec.mtls.mode
        - name: Phase
          type: string
          jsonPath: .status.phase
      schema:
        openAPIV3Schema:
          type: object
          properties:
            apiVersion:
              type: string
            kind:
              type: string
            metadata:
              type: object
            spec:
              type: object
              required:
                - serviceRef
              properties:
                serviceRef:
                  type: string
                timeoutSeconds:
                  type: integer
                mtls:
                  type: object
                  required:
                    - mode
                  properties:
                    mode:
                      type: string
                      enum: [Strict, Permissive, Disabled]
                    trustDomain:
                      type: string
                trafficSplit:
                  type: array
                  items:
                    type: object
                    required:
                      - backendService
                      - weight
                    properties:
                      backendService:
                        type: string
                      weight:
                        type: integer
                retries:
                  type: object
                  required:
                    - attempts
                  properties:
                    attempts:
                      type: integer
                    perTryTimeoutSeconds:
                      type: integer
                    retryOn:
                      type: string
                circuitBreaker:
                  type: object
                  properties:
                    maxConnections:
                      type: integer
                    maxPendingRequests:
                      type: integer
                    consecutiveErrors:
                      type: integer
            status:
              type: object
              properties:
                phase:
                  type: string
                endpointsActive:
                  type: integer
                conditions:
                  type: array
                  items:
                    type: object
                    properties:
                      type:
                        type: string
                      status:
                        type: string
                      reason:
                        type: string
                      message:
                        type: string
                      lastTransitionTime:
                        type: string
                        format: date-time
      subresources:
        status: {}
