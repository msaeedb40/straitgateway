apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: transitroutes.straitgateway.io
spec:
  group: straitgateway.io
  names:
    kind: TransitRoute
    listKind: TransitRouteList
    plural: transitroutes
    singular: transitroute
    shortNames:
      - tr
      - troute
  scope: Namespaced
  versions:
    - name: v1alpha1
      served: true
      storage: true
      additionalPrinterColumns:
        - name: CIDR
          type: string
          jsonPath: .spec.destinationCidr
        - name: TargetType
          type: string
          jsonPath: .spec.targetType
        - name: NextHop
          type: string
          jsonPath: .spec.nextHopIp
        - name: VRF
          type: integer
          jsonPath: .spec.vrf
        - name: Programmed
          type: boolean
          jsonPath: .status.programmed
      schema:
        openAPIV3Schema:
          type: object
          properties:
            apiVersion:
              type: string
            kind:
              type: string
            metadata:
              type: object
            spec:
              type: object
              required:
                - destinationCidr
                - targetType
              properties:
                destinationCidr:
                  type: string
                targetType:
                  type: string
                  enum: [Node, GatewayPeer, WireGuard, Interface, Blackhole]
                targetRef:
                  type: string
                nextHopIp:
                  type: string
                outgoingInterface:
                  type: string
                vrf:
                  type: integer
                metric:
                  type: integer
                communities:
                  type: array
                  items:
                    type: string
            status:
              type: object
              properties:
                programmed:
                  type: boolean
                nodesProgrammed:
                  type: array
                  items:
                    type: string
                lastSyncTime:
                  type: string
                  format: date-time
                message:
                  type: string
      subresources:
        status: {}
