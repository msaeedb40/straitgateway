# scripts/kind/kind-config.yaml
# kind cluster configuration for StraitGateway development.
#
# Key settings:
#   - disableDefaultCNI: true   — StraitGateway provides the CNI
#   - kubeProxyMode: "none"     — StraitGateway replaces kube-proxy
#   - extraMounts               — expose /sys/fs/bpf for eBPF pinning

kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4

networking:
  # StraitGateway owns CNI networking.
  disableDefaultCNI: true
  # StraitGateway replaces kube-proxy via eBPF socket LB.
  kubeProxyMode: "none"
  podSubnet: "10.244.0.0/16"

nodes:
  - role: control-plane
    extraMounts:
      # eBPF filesystem for pinned programs and maps
      - hostPath: /sys/fs/bpf
        containerPath: /sys/fs/bpf
      # Netkit/tracing requires debugfs
      - hostPath: /sys/kernel/debug
        containerPath: /sys/kernel/debug

    extraPortMappings:
      - containerPort: 30080
        hostPort: 30080
        protocol: TCP

  - role: worker
    extraMounts:
      - hostPath: /sys/fs/bpf
        containerPath: /sys/fs/bpf
      - hostPath: /sys/kernel/debug
        containerPath: /sys/kernel/debug

  - role: worker
    extraMounts:
      - hostPath: /sys/fs/bpf
        containerPath: /sys/fs/bpf
      - hostPath: /sys/kernel/debug
        containerPath: /sys/kernel/debug
