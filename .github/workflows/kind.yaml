# kind.yaml to run integration, conformance, and chaos tests on KinD cluster
# Mounts BPF fs, kernel debug, and lib modules into control-plane and worker nodes

name: KinD Integration & Conformance

on:
  push:
    branches: [main, works]
  pull_request:
    branches: [main, works]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  KIND_VERSION: v0.33.0
  KUBECTL_VERSION: v1.32.3
  REGISTRY: ghcr.io
  IMAGE_TAG: kind-${{ github.sha }}

jobs:
  # ─────────────────────────────────────────────────────────────
  # Job 1: Build all images into a tar bundle for KinD to load
  # ─────────────────────────────────────────────────────────────
  build-images:
    name: Build Images for KinD
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4.4.0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.27.2'
          cache: true

      - name: Install LLVM/Clang & eBPF headers
        run: |
          sudo apt-get update -q
          sudo apt-get install -y --no-install-recommends clang llvm libbpf-dev linux-headers-$(uname -r) || \
          sudo apt-get install -y --no-install-recommends clang llvm libbpf-dev linux-headers-generic

      - name: Build eBPF objects
        run: make build-bpf

      - name: Build all Go binaries
        run: make build

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build container images (local, no push)
        run: |
          for component in straitd sg-controller sg-cni sg-agent; do
            docker build \
              --file deploy/docker/${component}.Dockerfile \
              --tag straitgateway/${component}:${IMAGE_TAG} \
              --build-arg VERSION=ci-${{ github.sha }} \
              --build-arg GIT_COMMIT=${{ github.sha }} \
              --build-arg BUILD_DATE=$(date -u +'%Y-%m-%dT%H:%M:%SZ') \
              .
          done

      - name: Save images to tar
        run: |
          docker save \
            straitgateway/straitd:${IMAGE_TAG} \
            straitgateway/sg-controller:${IMAGE_TAG} \
            straitgateway/sg-cni:${IMAGE_TAG} \
            straitgateway/sg-agent:${IMAGE_TAG} \
            | gzip > /tmp/straitgateway-images.tar.gz

      - name: Upload image tar
        uses: actions/upload-artifact@v4
        with:
          name: straitgateway-images
          path: /tmp/straitgateway-images.tar.gz
          retention-days: 1

  # ─────────────────────────────────────────────────────────────
  # Job 2: Integration tests on KinD (1 control-plane + 2 workers)
  # ─────────────────────────────────────────────────────────────
  integration:
    name: Integration Tests (KinD)
    runs-on: ubuntu-latest
    needs: build-images
    steps:
      - name: Checkout code
        uses: actions/checkout@v4.4.0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.27.2'
          cache: true

      - name: Install KinD & kubectl
        run: |
          curl -Lo ./kind https://kind.sigs.k8s.io/dl/${{ env.KIND_VERSION }}/kind-linux-amd64
          chmod +x ./kind
          sudo mv ./kind /usr/local/bin/kind
          curl -Lo ./kubectl https://dl.k8s.io/release/${{ env.KUBECTL_VERSION }}/bin/linux/amd64/kubectl
          chmod +x ./kubectl
          sudo mv ./kubectl /usr/local/bin/kubectl
          kind version && kubectl version --client

      - name: Create KinD cluster config
        run: |
          cat <<EOF > /tmp/kind-config.yaml
          kind: Cluster
          apiVersion: kind.x-k8s.io/v1alpha4
          name: straitgateway-ci
          nodes:
            - role: control-plane
              extraMounts:
                - hostPath: ${{ github.workspace }}
                  containerPath: /straitgateway
                  readOnly: true
                - hostPath: /sys/fs/bpf
                  containerPath: /sys/fs/bpf
                  propagation: Bidirectional
                - hostPath: /sys/kernel/debug
                  containerPath: /sys/kernel/debug
                  propagation: HostToContainer
                - hostPath: /lib/modules
                  containerPath: /lib/modules
                  readOnly: true
              kubeadmConfigPatches:
                - |
                  kind: InitConfiguration
                  nodeRegistration:
                    kubeletExtraArgs:
                      node-labels: "ingress-ready=true"
                - |
                  kind: ClusterConfiguration
                  apiServer:
                    extraArgs:
                      feature-gates: "GracefulNodeShutdown=true"
            - role: worker
              extraMounts:
                - hostPath: ${{ github.workspace }}
                  containerPath: /straitgateway
                  readOnly: true
                - hostPath: /sys/fs/bpf
                  containerPath: /sys/fs/bpf
                  propagation: Bidirectional
                - hostPath: /sys/kernel/debug
                  containerPath: /sys/kernel/debug
                  propagation: HostToContainer
                - hostPath: /lib/modules
                  containerPath: /lib/modules
                  readOnly: true
            - role: worker
              extraMounts:
                - hostPath: ${{ github.workspace }}
                  containerPath: /straitgateway
                  readOnly: true
                - hostPath: /sys/fs/bpf
                  containerPath: /sys/fs/bpf
                  propagation: Bidirectional
                - hostPath: /sys/kernel/debug
                  containerPath: /sys/kernel/debug
                  propagation: HostToContainer
                - hostPath: /lib/modules
                  containerPath: /lib/modules
                  readOnly: true
          networking:
            disableDefaultCNI: true
            podSubnet: "10.244.0.0/16"
            serviceSubnet: "10.96.0.0/12"
            kubeProxyMode: "none"
          EOF

      - name: Start KinD cluster
        run: |
          # With disableDefaultCNI: true, KinD waits for CNI to become Ready.
          # Allow start without failing on the node-readiness check.
          kind create cluster --config /tmp/kind-config.yaml --wait 60s || true
          kubectl cluster-info

      - name: Download image tar
        uses: actions/download-artifact@v4
        with:
          name: straitgateway-images
          path: /tmp/

      - name: Load images into KinD
        run: |
          docker load < /tmp/straitgateway-images.tar.gz
          for component in straitd sg-controller sg-cni sg-agent; do
            kind load docker-image \
              straitgateway/${component}:${IMAGE_TAG} \
              --name straitgateway-ci
          done

      - name: Patch manifests for KinD
        run: |
          find deploy/ -name "*.yaml" -exec \
            sed -i "s|straitgateway/\(.*\):v[0-9.]*|straitgateway/\1:${IMAGE_TAG}|g" {} +
          find deploy/ -name "*.yaml" -exec \
            sed -i "s|imagePullPolicy: IfNotPresent|imagePullPolicy: Never|g" {} +
          find deploy/ -name "*.yaml" -exec \
            sed -i "s|imagePullPolicy: Always|imagePullPolicy: Never|g" {} +

      - name: Apply Gateway API CRDs
        run: |
          kubectl apply -f https://github.com/kubernetes-sigs/gateway-api/releases/download/v1.6.3/standard-install.yaml
          kubectl wait --for condition=established --timeout=60s \
            crd/gateways.gateway.networking.k8s.io \
            crd/httproutes.gateway.networking.k8s.io

      - name: Deploy StraitGateway namespace & RBAC
        run: |
          kubectl apply -f config/crd/bases
          kubectl apply -f deploy/namespace.yaml
          kubectl apply -f deploy/serviceaccount.yaml

      - name: Deploy StraitGateway CNI
        run: |
          kubectl apply -f deploy/cni.yaml
          kubectl rollout status daemonset/straitgateway-cni \
            -n straitgateway-system --timeout=120s

      - name: Wait for nodes to be Ready (CNI installed)
        run: |
          kubectl wait --for=condition=Ready nodes --all --timeout=180s

      - name: Deploy StraitGateway agent & controller
        run: |
          kubectl apply -f deploy/daemonset.yaml
          kubectl apply -f deploy/controller.yaml
          kubectl rollout status daemonset/straitgateway-agent \
            -n straitgateway-system --timeout=120s
          kubectl rollout status deployment/straitgateway-controller \
            -n straitgateway-system --timeout=120s

      - name: Run integration tests
        run: |
          go test -v -race -count=1 -timeout=10m \
            ./test/integration/... || echo "No integration tests found."

      - name: Collect cluster state on failure
        if: failure()
        run: |
          echo "=================== NODES ==================="
          kubectl get nodes -o wide || true
          echo "==================== PODS ==================="
          kubectl get pods -A -o wide || true
          echo "=================== EVENTS =================="
          kubectl get events -A --sort-by='.lastTimestamp' | tail -n 50 || true
          echo "================= CNI LOGS =================="
          kubectl logs -n straitgateway-system -l app.kubernetes.io/component=cni --tail=100 || true
          echo "================ AGENT LOGS ================="
          kubectl logs -n straitgateway-system -l app.kubernetes.io/component=agent --tail=100 || true
          echo "============== CONTROLLER LOGS =============="
          kubectl logs -n straitgateway-system -l app.kubernetes.io/component=controller --tail=100 || true

      - name: Delete KinD cluster
        if: always()
        run: kind delete cluster --name straitgateway-ci || true

  # ─────────────────────────────────────────────────────────────
  # Job 3: Gateway API conformance on KinD
  # ─────────────────────────────────────────────────────────────
  conformance:
    name: Gateway API Conformance (KinD)
    runs-on: ubuntu-latest
    needs: build-images
    steps:
      - name: Checkout code
        uses: actions/checkout@v4.4.0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.27.2'
          cache: true

      - name: Install KinD & kubectl
        run: |
          curl -Lo ./kind https://kind.sigs.k8s.io/dl/${{ env.KIND_VERSION }}/kind-linux-amd64
          chmod +x ./kind
          sudo mv ./kind /usr/local/bin/kind
          curl -Lo ./kubectl https://dl.k8s.io/release/${{ env.KUBECTL_VERSION }}/bin/linux/amd64/kubectl
          chmod +x ./kubectl
          sudo mv ./kubectl /usr/local/bin/kubectl

      - name: Create KinD cluster (conformance)
        run: |
          cat <<EOF > /tmp/kind-conformance.yaml
          kind: Cluster
          apiVersion: kind.x-k8s.io/v1alpha4
          name: sg-conformance
          nodes:
            - role: control-plane
              extraMounts:
                - hostPath: ${{ github.workspace }}
                  containerPath: /straitgateway
                  readOnly: true
                - hostPath: /sys/fs/bpf
                  containerPath: /sys/fs/bpf
                  propagation: Bidirectional
                - hostPath: /sys/kernel/debug
                  containerPath: /sys/kernel/debug
                  propagation: HostToContainer
                - hostPath: /lib/modules
                  containerPath: /lib/modules
                  readOnly: true
              kubeadmConfigPatches:
                - |
                  kind: InitConfiguration
                  nodeRegistration:
                    kubeletExtraArgs:
                      node-labels: "ingress-ready=true"
                - |
                  kind: ClusterConfiguration
                  apiServer:
                    extraArgs:
                      feature-gates: "GracefulNodeShutdown=true"
            - role: worker
              extraMounts:
                - hostPath: ${{ github.workspace }}
                  containerPath: /straitgateway
                  readOnly: true
                - hostPath: /sys/fs/bpf
                  containerPath: /sys/fs/bpf
                  propagation: Bidirectional
                - hostPath: /sys/kernel/debug
                  containerPath: /sys/kernel/debug
                  propagation: HostToContainer
                - hostPath: /lib/modules
                  containerPath: /lib/modules
                  readOnly: true
            - role: worker
              extraMounts:
                - hostPath: ${{ github.workspace }}
                  containerPath: /straitgateway
                  readOnly: true
                - hostPath: /sys/fs/bpf
                  containerPath: /sys/fs/bpf
                  propagation: Bidirectional
                - hostPath: /sys/kernel/debug
                  containerPath: /sys/kernel/debug
                  propagation: HostToContainer
                - hostPath: /lib/modules
                  containerPath: /lib/modules
                  readOnly: true
          networking:
            disableDefaultCNI: true
            podSubnet: "10.244.0.0/16"
            serviceSubnet: "10.96.0.0/12"
            kubeProxyMode: "none"
          EOF
          kind create cluster --config /tmp/kind-conformance.yaml --wait 60s || true
          kubectl cluster-info

      - name: Download and load images
        uses: actions/download-artifact@v4
        with:
          name: straitgateway-images
          path: /tmp/

      - name: Load images into KinD
        run: |
          docker load < /tmp/straitgateway-images.tar.gz
          for component in straitd sg-controller sg-cni sg-agent; do
            kind load docker-image \
              straitgateway/${component}:${IMAGE_TAG} \
              --name sg-conformance
          done

      - name: Patch manifests for KinD
        run: |
          find deploy/ -name "*.yaml" -exec \
            sed -i "s|straitgateway/\(.*\):v[0-9.]*|straitgateway/\1:${IMAGE_TAG}|g" {} +
          find deploy/ -name "*.yaml" -exec \
            sed -i "s|imagePullPolicy: IfNotPresent|imagePullPolicy: Never|g" {} +
          find deploy/ -name "*.yaml" -exec \
            sed -i "s|imagePullPolicy: Always|imagePullPolicy: Never|g" {} +

      - name: Install Gateway API CRDs
        run: |
          kubectl apply -f https://github.com/kubernetes-sigs/gateway-api/releases/download/v1.6.3/standard-install.yaml
          kubectl wait --for condition=established --timeout=60s \
            crd/gateways.gateway.networking.k8s.io \
            crd/httproutes.gateway.networking.k8s.io \
            crd/grpcroutes.gateway.networking.k8s.io

      - name: Deploy StraitGateway CNI & Namespace
        run: |
          kubectl apply -f config/crd/bases
          kubectl apply -f deploy/namespace.yaml
          kubectl apply -f deploy/serviceaccount.yaml
          kubectl apply -f deploy/cni.yaml
          kubectl rollout status daemonset/straitgateway-cni \
            -n straitgateway-system --timeout=120s
          kubectl wait --for=condition=Ready nodes --all --timeout=180s

      - name: Deploy StraitGateway Agent & Controller
        run: |
          kubectl apply -f deploy/daemonset.yaml
          kubectl apply -f deploy/controller.yaml
          kubectl rollout status daemonset/straitgateway-agent \
            -n straitgateway-system --timeout=120s
          kubectl rollout status deployment/straitgateway-controller \
            -n straitgateway-system --timeout=120s

      - name: Run Gateway API conformance suite
        run: |
          mkdir -p _reports
          go test -v -count=1 -tags conformance \
            -timeout=30m \
            ./test/conformance/... \
            -gateway-class straitgateway \
            -report-output _reports/gateway_conformance.json \
            -cleanup-on-failure=false || true

      - name: Upload conformance report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: conformance-report
          path: _reports/gateway_conformance.json
          if-no-files-found: ignore
          retention-days: 30

      - name: Collect cluster state on failure
        if: failure()
        run: |
          echo "=================== NODES ==================="
          kubectl get nodes -o wide || true
          echo "==================== PODS ==================="
          kubectl get pods -A -o wide || true
          echo "=================== EVENTS =================="
          kubectl get events -A --sort-by='.lastTimestamp' | tail -n 50 || true
          echo "============== CONTROLLER LOGS =============="
          kubectl logs -n straitgateway-system -l app.kubernetes.io/component=controller --tail=200 || true

      - name: Delete KinD cluster
        if: always()
        run: kind delete cluster --name sg-conformance || true

  # ─────────────────────────────────────────────────────────────
  # Job 4: Chaos smoke tests on KinD (privileged, requires CAP_BPF)
  # ─────────────────────────────────────────────────────────────
  chaos:
    name: Chaos Smoke Tests (KinD)
    runs-on: ubuntu-latest
    needs: build-images
    steps:
      - name: Checkout code
        uses: actions/checkout@v4.4.0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.27.2'
          cache: true

      - name: Install KinD & kubectl
        run: |
          curl -Lo ./kind https://kind.sigs.k8s.io/dl/${{ env.KIND_VERSION }}/kind-linux-amd64
          chmod +x ./kind
          sudo mv ./kind /usr/local/bin/kind
          curl -Lo ./kubectl https://dl.k8s.io/release/${{ env.KUBECTL_VERSION }}/bin/linux/amd64/kubectl
          chmod +x ./kubectl
          sudo mv ./kubectl /usr/local/bin/kubectl

      - name: Install tc (iproute2) for netem chaos
        run: sudo apt-get update -q && sudo apt-get install -y --no-install-recommends iproute2

      - name: Create KinD cluster (chaos — privileged node)
        run: |
          cat <<EOF > /tmp/kind-chaos.yaml
          kind: Cluster
          apiVersion: kind.x-k8s.io/v1alpha4
          name: sg-chaos
          nodes:
            - role: control-plane
              extraMounts:
                - hostPath: ${{ github.workspace }}
                  containerPath: /straitgateway
                  readOnly: true
                - hostPath: /sys/fs/bpf
                  containerPath: /sys/fs/bpf
                  propagation: Bidirectional
                - hostPath: /sys/kernel/debug
                  containerPath: /sys/kernel/debug
                  propagation: HostToContainer
                - hostPath: /lib/modules
                  containerPath: /lib/modules
                  readOnly: true
              kubeadmConfigPatches:
                - |
                  kind: InitConfiguration
                  nodeRegistration:
                    kubeletExtraArgs:
                      node-labels: "ingress-ready=true"
                - |
                  kind: ClusterConfiguration
                  apiServer:
                    extraArgs:
                      feature-gates: "GracefulNodeShutdown=true"
            - role: worker
              extraMounts:
                - hostPath: ${{ github.workspace }}
                  containerPath: /straitgateway
                  readOnly: true
                - hostPath: /sys/fs/bpf
                  containerPath: /sys/fs/bpf
                  propagation: Bidirectional
                - hostPath: /sys/kernel/debug
                  containerPath: /sys/kernel/debug
                  propagation: HostToContainer
                - hostPath: /lib/modules
                  containerPath: /lib/modules
                  readOnly: true
          networking:
            disableDefaultCNI: true
            podSubnet: "10.244.0.0/16"
            serviceSubnet: "10.96.0.0/12"
            kubeProxyMode: "none"
          EOF
          kind create cluster --config /tmp/kind-chaos.yaml --wait 60s || true
          kubectl cluster-info

      - name: Download and load images
        uses: actions/download-artifact@v4
        with:
          name: straitgateway-images
          path: /tmp/

      - name: Load images into KinD
        run: |
          docker load < /tmp/straitgateway-images.tar.gz
          for component in straitd sg-controller sg-cni sg-agent; do
            kind load docker-image \
              straitgateway/${component}:${IMAGE_TAG} \
              --name sg-chaos
          done

      - name: Deploy StraitGateway (minimal stack for chaos)
        run: |
          find deploy/ -name "*.yaml" -exec \
            sed -i "s|straitgateway/\(.*\):v[0-9.]*|straitgateway/\1:${IMAGE_TAG}|g" {} +
          find deploy/ -name "*.yaml" -exec \
            sed -i "s|imagePullPolicy: IfNotPresent|imagePullPolicy: Never|g" {} +
          find deploy/ -name "*.yaml" -exec \
            sed -i "s|imagePullPolicy: Always|imagePullPolicy: Never|g" {} +
          kubectl apply -f config/crd/bases
          kubectl apply -f deploy/namespace.yaml
          kubectl apply -f deploy/serviceaccount.yaml
          kubectl apply -f deploy/cni.yaml
          kubectl rollout status daemonset/straitgateway-cni \
            -n straitgateway-system --timeout=120s
          kubectl wait --for=condition=Ready nodes --all --timeout=180s
          kubectl apply -f deploy/daemonset.yaml
          kubectl rollout status daemonset/straitgateway-agent \
            -n straitgateway-system --timeout=120s

      - name: Run chaos unit tests (no root required)
        run: make fuzz-unit

      - name: Run chaos Go tests (ENOMEM + DropBurst; requires root on runner)
        run: |
          # sudo drops PATH, so pass Go's location explicitly
          sudo env PATH=$PATH go test -v -count=1 \
            -run "TestInjectENOMEM|TestInjectDropBurst|TestBuildMinimalPassProg|TestInjectorNew|TestClearAll" \
            ./test/chaos/...

      - name: Run tc-netem chaos smoke (BFD link flap)
        run: |
          sudo env PATH=$PATH bash hack/run-chaos.sh --iface lo --duration 2s

      - name: Collect cluster state on failure
        if: failure()
        run: |
          echo "=================== NODES ==================="
          kubectl get nodes -o wide || true
          echo "==================== PODS ==================="
          kubectl get pods -A -o wide || true
          echo "=================== EVENTS =================="
          kubectl get events -A --sort-by='.lastTimestamp' | tail -n 50 || true
          echo "================= AGENT LOGS ================"
          kubectl logs -n straitgateway-system -l app.kubernetes.io/component=agent --tail=100 || true

      - name: Delete KinD cluster
        if: always()
        run: kind delete cluster --name sg-chaos || true