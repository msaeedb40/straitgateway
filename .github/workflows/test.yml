name: Test

on:
  push:
    branches: [ main, works ]
  pull_request:
    branches: [ main, works ]

jobs:
  unit-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - name: Run Unit Tests
        run: go test -v -race ./...
