name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - name: Build All Binaries
        run: make build

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            bin/straitd
            bin/sg-controller
            bin/sg-cni
            bin/sg-agent
            bin/sgctl
