name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  packages: write

jobs:
  release:
    name: Release Binaries & Helm Chart
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.27.1'

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.14.3

      - name: Build Binaries (amd64 and arm64)
        run: |
          make build VERSION=${{ github.ref_name }} GOARCH=amd64
          make build VERSION=${{ github.ref_name }} GOARCH=arm64

      - name: Package Helm Chart
        run: |
          mkdir -p dist
          VERSION="${{ github.ref_name }}"
          VERSION="${VERSION#v}"  # strip leading 'v' for SemVer compliance
          helm package straitgateway-helm/ -d dist/ --version "$VERSION" --app-version "$VERSION"

      - name: Generate Checksums
        run: |
          cd dist
          find . -type f ! -name "checksums.txt" -exec sha256sum {} + > checksums.txt
          cat checksums.txt

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/linux-amd64/*
            dist/linux-arm64/*
            dist/*.tgz
            dist/checksums.txt
          generate_release_notes: true
