name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  packages: write

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.1'
      - run: make build VERSION=${{ github.ref_name }}
      - run: make helm-package VERSION=${{ github.ref_name }}
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/linux-amd64/*
            dist/linux-arm64/*
            dist/*.tgz
          generate_release_notes: true
