name: Build

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]

jobs:
  docker-build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        component: [straitd, sg-controller, sg-cni, sg-agent, sgctl]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - name: Build binary
        run: make ${{ matrix.component }}
