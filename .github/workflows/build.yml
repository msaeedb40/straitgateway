name: Build

on:
  push:
    branches: ["main", "developer"]
  pull_request:
    branches: ["main", "developer"]

permissions:
  contents: read
  packages: write

jobs:
  build:
    name: Build Binaries
    runs-on: ubuntu-latest
    strategy:
      matrix:
        goarch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.7"
      - name: Build (${{ matrix.goarch }})
        env:
          GOOS: linux
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          mkdir -p dist/linux-${{ matrix.goarch }}
          for bin in straitd sg-controller tgwd strait-cni sgctl sgpktcap; do
            go build \
              -ldflags "-X github.com/straitgateway/straitgateway/pkg/version.Version=${GITHUB_REF_NAME:-dev} \
                        -X github.com/straitgateway/straitgateway/pkg/version.GitCommit=${GITHUB_SHA::8} \
                        -w -s" \
              -o dist/linux-${{ matrix.goarch }}/$bin \
              ./cmd/$bin/
          done
      - uses: actions/upload-artifact@v4
        with:
          name: binaries-linux-${{ matrix.goarch }}
          path: dist/linux-${{ matrix.goarch }}/

  build-ebpf:
    name: Build eBPF Programs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Clang 22 / LLVM 22
        run: |
          wget -qO - https://apt.llvm.org/llvm-snapshot.gpg.key | sudo apt-key add -
          echo "deb http://apt.llvm.org/noble/ llvm-toolchain-noble-22 main" | \
            sudo tee /etc/apt/sources.list.d/llvm.list
          sudo apt-get update -q
          sudo apt-get install -y clang-22 llvm-22 libbpf-dev linux-headers-$(uname -r)
      - name: Generate vmlinux.h
        run: |
          sudo apt-get install -y bpftool || true
          bpftool btf dump file /sys/kernel/btf/vmlinux format c > bpf/headers/vmlinux.h || \
            echo "vmlinux.h generation skipped"
      - name: Compile eBPF programs
        run: make build-ebpf CLANG=clang-22 LLC=llc-22
