name: Build

on:
  push:
    branches: [main, works]
    tags: ['v*']
  pull_request:
    branches: [main, works]

permissions:
  contents: read

jobs:
  docker-build:
    name: Build ${{ matrix.component }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        component: [straitd, sg-controller, sg-cni, sg-agent, sgctl]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.27.2'
          cache: true

      - name: Install LLVM/Clang (for eBPF dependencies)
        run: |
          sudo apt-get update -q
          sudo apt-get install -y clang llvm libbpf-dev linux-headers-$(uname -r) || \
          sudo apt-get install -y clang llvm libbpf-dev linux-headers-generic

      - name: Build binary
        run: make ${{ matrix.component }}

      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.component }}
          path: bin/${{ matrix.component }}
          retention-days: 7
