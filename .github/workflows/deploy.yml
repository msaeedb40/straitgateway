name: Deploy

on:
  push:
    branches:
      - main
      - developer
    paths:
      - 'straitgateway-helm/**'
      - 'hack/pages/**'
      - 'dist/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  # ── Deploy Helm Repository & Landing Page to GitHub Pages ───────────────────
  deploy-pages:
    name: Deploy GitHub Pages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: azure/setup-helm@v5
        with:
          version: latest

      - name: Package Helm chart & generate Tailwind v4 pages
        run: bash hack/pages/generate-pages.sh

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: gh-pages
          force_orphan: true
