name: CI

on:
  push:
    branches: [main, developer]
  pull_request:
    branches: [main, developer]

permissions:
  contents: write
  packages: write
  security-events: write
  pages: write
  id-token: write

env:
  REGISTRY: ghcr.io/msaeedb40
  GO_VERSION: "1.26"
  CLANG_VERSION: "22"
  LLVM_VERSION: "22"
  ALPINE_VERSION: "3.24.1"
  ARCHS: "linux/amd64,linux/arm64"

  # ------------------------------------------------------------------------------



jobs:
  # ── Go Lint & Verification ──────────────────────────────────────────────────
  lint:
    name: Go Lint & Verification
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: Verify License Headers
        run: bash hack/verify/verify-boilerplate.sh
      - name: Verify Go Modules
        run: bash hack/verify/verify-go-modules.sh
      - name: go vet
        run: go vet ./...
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: latest
          args: --timeout=5m

  # ── Helm Lint ────────────────────────────────────────────────────────────────
  helm-lint:
    name: Helm Lint
    runs-on: ubuntu-latest
    steps:
      - name: Helm Lint checkout  
        uses: actions/checkout@v4
      - name: Set up Helm for Helm Lint
        uses: azure/setup-helm@v5
        with:
          version: latest
      - name: Helm lint
        run: helm lint ./straitgateway-helm --strict
      - name: Helm template render
        run: helm template straitgateway ./straitgateway-helm --namespace straitgateway-system --kube-version 1.34.0 > /dev/null

  # ── Go Unit Tests ────────────────────────────────────────────────────────────
  test-unit:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Unit Tests checkout
        uses: actions/checkout@v4
      - name: Set up Go for Unit Tests
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: Run unit tests
        run: go test -v -race -count=1 -coverprofile=coverage.out ./test/integration/...
      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.out

  # ── Security Scan ─────────────────────────────────────────────────────────────
  security:
    name: Security Scan
    runs-on: ubuntu-latest
    # Scan on pull requests (main or developer) or on push to main (developer → main merge)
    if: |

      (github.event_name == 'pull_request' &&
      (github.base_ref == 'main' || github.base_ref == 'developer')) ||
      (github.event_name == 'push' &&
      (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/developer'))   

    steps:
      - name: security checkout
        uses: actions/checkout@v4

      - name: Install Tetragon
        uses: lizrice/tetragon-ci/.github/actions/tetragon-setup@v0.1.1
        with:
          tetragon_version: v1.7.0
          enforce_policies: "false"

      - name: Set up Go for security scan 
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
          cache: false

      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...
      - name: Trivy FS scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          format: sarif
          output: trivy-results.sarif
      - name: Upload Trivy SARIF
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-results.sarif

      - name: Report Tetragon events
        if: ${{ always() }}
        uses: lizrice/tetragon-ci/.github/actions/tetragon-report@v0.1.1

  # ── Multi-Arch Binary Builds ─────────────────────────────────────────────────
  build:
    name: Build (${{ matrix.goos }}/${{ matrix.goarch }})
    runs-on: ubuntu-latest
    needs: [lint, test-unit]
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
    steps:
      - name: Build checkout  
        uses: actions/checkout@v4
      - name: Set up Go for build 
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: Build all binaries
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          mkdir -p dist/${{ matrix.goos }}_${{ matrix.goarch }}
          for cmd in straitgatewayd sg-controller sg-cli; do
            echo "Building $cmd (${{ matrix.goos }}/${{ matrix.goarch }})..."
            go build \
              -ldflags="-s -w \
                -X github.com/msaeedb40/straitgateway/internal/version.Version=${GITHUB_REF_NAME:-dev} \
                -X github.com/msaeedb40/straitgateway/internal/version.Commit=${GITHUB_SHA:-none} \
                -X github.com/msaeedb40/straitgateway/internal/version.BuildDate=$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
              -o dist/${{ matrix.goos }}_${{ matrix.goarch }}/$cmd \
              ./cmd/$cmd/
          done
          echo "Building straitgateway-cni (${{ matrix.goos }}/${{ matrix.goarch }})..."
          go build \
            -ldflags="-s -w \
              -X github.com/msaeedb40/straitgateway/internal/version.Version=${GITHUB_REF_NAME:-dev} \
              -X github.com/msaeedb40/straitgateway/internal/version.Commit=${GITHUB_SHA:-none} \
              -X github.com/msaeedb40/straitgateway/internal/version.BuildDate=$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            -o dist/${{ matrix.goos }}_${{ matrix.goarch }}/straitgateway-cni \
            ./cni
      - name: Upload binaries
        uses: actions/upload-artifact@v4
        with:
          name: binaries-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/${{ matrix.goos }}_${{ matrix.goarch }}/

  # ── Docker Build & Push ──────────────────────────────────────────────────────
  docker-build:
    name: Docker Build & Push (${{ matrix.image }})
    runs-on: ubuntu-latest
    needs: [build]
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: straitgateway-controller
            dockerfile: build/Dockerfile.sg-controller
            context: .
          - image: straitgatewayd
            dockerfile: build/Dockerfile.straitgatewayd
            context: .
          - image: straitgateway-cli
            dockerfile: build/Dockerfile.sg-cli
            context: .
          - image: straitgateway-ui
            dockerfile: build/Dockerfile.ui
            context: .
    steps:
      - uses: actions/checkout@v4
      - name: Set up QEMU (multi-arch)
        uses: docker/setup-qemu-action@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Login to GHCR
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/developer')
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ matrix.image }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=sha,prefix=git-
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: ${{ github.event_name == 'push' && 'linux/amd64,linux/arm64' || 'linux/amd64' }}
          push: ${{ github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/developer') }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            GO_VERSION=${{ env.GO_VERSION }}
            CLANG_VERSION=${{ env.CLANG_VERSION }}
            LLVM_VERSION=${{ env.LLVM_VERSION }}
            ALPINE_VERSION=${{ env.ALPINE_VERSION }}

  # ── Helm Install Test (kind) ─────────────────────────────────────────────────
  helm-test:
    name: Helm Install Test
    runs-on: ubuntu-latest
    needs: [helm-lint]
    steps:
      - name: Helm Install Test checkout
        uses: actions/checkout@v4
      - name: Set up Helm for Helm Install Test
        uses: azure/setup-helm@v5
        with:
          version: latest
      - name: Create kind cluster
        uses: helm/kind-action@v1
        with:
          version: v0.33.0  
          cluster_name: straitgateway-ci
          node_image: kindest/node:v1.36.4 
          config: .github/kind-config.yaml
      
 
      - name: Build local container images for kind
        run: |
          docker build --build-arg ALPINE_VERSION=${{ env.ALPINE_VERSION }} --build-arg GO_VERSION=${{ env.GO_VERSION }} -f build/Dockerfile.sg-controller -t ${{ env.REGISTRY }}/straitgateway-controller:1.0.0 .
          docker build --build-arg ALPINE_VERSION=${{ env.ALPINE_VERSION }} --build-arg GO_VERSION=${{ env.GO_VERSION }} --build-arg CLANG_VERSION=${{ env.CLANG_VERSION }} --build-arg LLVM_VERSION=${{ env.LLVM_VERSION }} -f build/Dockerfile.straitgatewayd -t ${{ env.REGISTRY }}/straitgatewayd:1.0.0 .
          docker build --build-arg ALPINE_VERSION=${{ env.ALPINE_VERSION }} --build-arg GO_VERSION=${{ env.GO_VERSION }} -f build/Dockerfile.sg-cli -t ${{ env.REGISTRY }}/straitgateway-cli:1.0.0 .
          docker build -f build/Dockerfile.ui -t ${{ env.REGISTRY }}/straitgateway-ui:1.0.0 .
      - name: Load images into kind cluster
        run: |
          kind load docker-image --name straitgateway-ci \
            ${{ env.REGISTRY }}/straitgateway-controller:1.0.0 \
            ${{ env.REGISTRY }}/straitgatewayd:1.0.0 \
            ${{ env.REGISTRY }}/straitgateway-cli:1.0.0 \
            ${{ env.REGISTRY }}/straitgateway-ui:1.0.0
      - name: Install Gateway API CRDs
        run: |
          kubectl apply --server-side -f \
            https://github.com/kubernetes-sigs/gateway-api/releases/download/v1.6.1/standard-install.yaml

      # ── Phase 1: Bootstrap CNI ────────────────────────────────────────────────
      # Install the agent DaemonSet ONLY first. The agent uses hostNetwork=true
      # so it does NOT need a CNI to start. It installs the straitgateway CNI
      # binary/config on each node, which brings nodes to Ready state.
      # The controller and UI use regular pod networking and would crash if started
      # before CNI is ready (can't reach kubernetes.default.svc:443).
      - name: "Phase 1: Install agent DaemonSet (CNI bootstrap)"
        run: |
          helm install straitgateway ./straitgateway-helm \
            --namespace straitgateway-system \
            --create-namespace \
            --set global.clusterName=ci \
            --set kubeProxyReplacement.enabled=true \
            --set ui.enabled=false \
            --set controller.replicaCount=0 \
            --timeout=10m
          # Wait without --wait since replicas=0 for controller makes --wait finish immediately
          # but we need the DaemonSet pods to be Running first.
          echo "Waiting for agent DaemonSet pods to be Running..."
          kubectl rollout status daemonset/straitgateway-agent \
            -n straitgateway-system --timeout=8m

      # ── Phase 2: Wait for all nodes to be Ready (CNI active) ─────────────────
      - name: "Phase 2: Wait for nodes Ready (CNI bootstrapped)"
        run: |
          echo "Waiting for all cluster nodes to reach Ready state..."
          kubectl wait --for=condition=Ready nodes --all --timeout=5m
          echo "All nodes are Ready. Node status:"
          kubectl get nodes -o wide

      # ── Phase 2.5: Verify CRDs are established ──────────────────────────────
      - name: "Phase 2.5: Verify CRDs are established"
        run: |
          echo "Waiting for all CRDs to be established..."
          kubectl wait --for=condition=Established crds --all --timeout=2m
          echo "All CRDs established:"
          kubectl get crds | grep -E 'strait|gateway'

      # ── Phase 2.7: Confirm agent pods are Ready (eBPF dataplane is live) ────
      # node/Ready only means the CNI binary exists on disk. We must wait for
      # the agent pod itself to pass its readiness probe, which confirms the
      # eBPF programs are loaded and the dataplane is routing pod traffic.
      # Without this, controller/UI pods get pod IPs but can't reach
      # kubernetes.default.svc:443, causing readiness probes to fail.
      - name: "Phase 2.7: Wait for agent pods Ready (eBPF dataplane live)"
        run: |
          echo "Waiting for all straitgateway-agent pods to be Ready..."
          kubectl wait pod \
            --for=condition=Ready \
            --selector=app.kubernetes.io/component=agent \
            --namespace=straitgateway-system \
            --timeout=8m
          echo "Agent pods Ready — eBPF dataplane is live:"
          kubectl get pods -n straitgateway-system -l app.kubernetes.io/component=agent -o wide

      # ── Phase 2.9: Verify ClusterIP routing (kube-proxy replacement) ─────────
      # The controller needs to reach kubernetes.default.svc:443 for API calls.
      # If the eBPF service DNAT isn't working, the controller readiness probe
      # will fail silently for the entire 15 min timeout. This step fails fast
      # with a clear error if ClusterIP routing is broken.
      #
      # IMPORTANT: kind is configured with disableDefaultCNI: true, so no image
      # can be pulled from Docker Hub at this point. We MUST use an image that
      # was already loaded into kind via "kind load docker-image". The
      # straitgateway-cli image (Alpine-based) has wget with TLS support.
      - name: "Phase 2.9: Verify ClusterIP routing (kube-proxy replacement)"
        run: |
          echo "Testing ClusterIP connectivity to kubernetes.default.svc:443..."
          # Use the pre-loaded straitgateway-cli image (Alpine + wget).
          # kubectl run does not support --timeout; poll the phase instead.
          kubectl run net-test \
            --image=${{ env.REGISTRY }}/straitgateway-cli:1.0.0 \
            --image-pull-policy=Never \
            --restart=Never \
            --command \
            -- wget -qO- --timeout=10 --tries=3 \
               --no-check-certificate https://kubernetes.default.svc/healthz

          # Wait up to 90s for the pod to complete (5s × 18 iterations)
          for i in $(seq 1 18); do
            STATUS=$(kubectl get pod net-test \
              -o jsonpath='{.status.phase}' 2>/dev/null || echo "Pending")
            REASON=$(kubectl get pod net-test \
              -o jsonpath='{.status.containerStatuses[0].state.waiting.reason}' \
              2>/dev/null || true)
            echo "  [${i}/18] net-test pod: $STATUS${REASON:+ ($REASON)}"
            if [ "$STATUS" = "Succeeded" ]; then
              echo "ClusterIP routing OK ✔ — eBPF kube-proxy replacement is working"
              kubectl delete pod net-test --ignore-not-found
              break
            elif [ "$STATUS" = "Failed" ] || [ "$REASON" = "ErrImageNeverPull" ]; then
              echo "FAIL: ClusterIP UNREACHABLE ✘"
              kubectl logs net-test 2>/dev/null || true
              kubectl describe pod net-test || true
              kubectl delete pod net-test --ignore-not-found
              exit 1
            fi
            sleep 5
          done

      # ── Phase 3: Upgrade with full chart (controller + UI) ───────────────────
      - name: "Phase 3: Upgrade to full chart (controller + UI)"
        run: |
          # Phase 1 installed with controller.replicaCount=0; explicitly
          # reset to 1. --rollback-on-failure auto-reverts on timeout so
          # the release is never left in a broken state.
          helm upgrade --install straitgateway ./straitgateway-helm \
            --namespace straitgateway-system \
            --set global.clusterName=ci \
            --set kubeProxyReplacement.enabled=true \
            --set controller.replicaCount=1 \
            --set ui.enabled=true \
            --rollback-on-failure \
            --timeout=15m

          echo "── Waiting for controller rollout ──"
          kubectl rollout status deployment/straitgateway-controller \
            -n straitgateway-system --timeout=8m

          echo "── Waiting for UI rollout ──"
          kubectl rollout status deployment/straitgateway-ui \
            -n straitgateway-system --timeout=5m

          echo "── All deployments ready ──"
          kubectl get pods -n straitgateway-system -o wide

      - name: Diagnose failed deployment
        if: always()
        run: |
          echo "=== NODES ==="
          kubectl get nodes -o wide

          echo "=== PODS ==="
          kubectl get pods -n straitgateway-system -o wide

          echo "=== DEPLOYMENTS ==="
          kubectl get deployment -n straitgateway-system

          echo "=== DAEMONSETS ==="
          kubectl get daemonset -n straitgateway-system

          echo "=== SERVICES ==="
          kubectl get svc -n straitgateway-system

          echo "=== EVENTS ==="
          kubectl get events -n straitgateway-system \
            --sort-by='.lastTimestamp'

          echo "=== CONTROLLER DESCRIBE ==="
          kubectl describe deployment straitgateway-controller \
            -n straitgateway-system || true

          echo "=== UI DESCRIBE ==="
          kubectl describe deployment straitgateway-ui \
            -n straitgateway-system || true

          echo "=== AGENT DESCRIBE ==="
          kubectl describe daemonset straitgateway-agent \
            -n straitgateway-system || true

          echo "=== CONTAINER LOGS (current) ==="
          for pod in $(kubectl get pods -n straitgateway-system \
            -o jsonpath='{.items[*].metadata.name}'); do
            echo "===== $pod ====="
            kubectl logs "$pod" -n straitgateway-system \
              --all-containers=true \
              --ignore-errors \
              --tail=200 || true
          done

          echo "=== CONTAINER LOGS (previous/crashed) ==="
          for pod in $(kubectl get pods -n straitgateway-system \
            -o jsonpath='{.items[*].metadata.name}'); do
            echo "===== $pod (previous) ====="
            kubectl logs "$pod" -n straitgateway-system \
              --all-containers=true \
              --ignore-errors \
              --previous \
              --tail=100 2>/dev/null || true
          done

      - name: Helm upgrade --install (idempotency check)
        run: |
          helm upgrade --install straitgateway ./straitgateway-helm \
            --namespace straitgateway-system \
            --set global.clusterName=ci \
            --set kubeProxyReplacement.enabled=true \
            --set controller.replicaCount=1 \
            --set ui.enabled=true \
            --rollback-on-failure \
            --debug \
            --timeout=15m

          kubectl rollout status deployment/straitgateway-controller \
            -n straitgateway-system --timeout=8m
          kubectl rollout status deployment/straitgateway-ui \
            -n straitgateway-system --timeout=5m
      - name: Helm test
        run: helm test straitgateway --namespace straitgateway-system --timeout 10m
      - name: Helm uninstall
        run: helm uninstall straitgateway --namespace straitgateway-system

  # ── Angular UI Build ─────────────────────────────────────────────────────────
  ui-build:
    name: UI Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - name: Install dependencies
        working-directory: ui
        run: npm ci
      - name: Run unit tests
        working-directory: ui
        run: npm run test -- --watch=false
      - name: Build production
        working-directory: ui
        run: npm run build -- --configuration=production
      - name: Upload UI artifact
        uses: actions/upload-artifact@v4
        with:
          name: ui-dist
          path: ui/dist/