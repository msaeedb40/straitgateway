name: CI

on:
  push:
    branches: [ main, works ]
  pull_request:
    branches: [ main, works ]

jobs:
  lint-and-vet:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - name: Go Format and Vet
        run: |
          go vet ./...
          test -z "$(gofmt -l .)" || (echo "Files need formatting:" && gofmt -l . && exit 1)

  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - name: Install LLVM/Clang
        run: sudo apt-get update && sudo apt-get install -y clang llvm libbpf-dev

      - name: Build All Binaries
        run: make build
