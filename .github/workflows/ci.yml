name: CI

on:
  push:
    branches: [main, works]
  pull_request:
    branches: [main, works]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  lint:
    name: Lint & Vet
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.27.1'
          cache: true

      - name: Verify dependencies
        run: go mod verify

      - name: Go Format check
        run: |
          # Collect hand-authored Go files; skip generated, vendor, testdata
          GOFILES=$(find . -name "*.go" \
            -not -path "./vendor/*" \
            -not -path "*/testdata/*" \
            -not -name "zz_generated.*" \
            -not -name "*_generated.go")
          UNFORMATTED=$(gofmt -l $GOFILES)
          if [ -n "$UNFORMATTED" ]; then
            echo "The following files need gofmt formatting:"
            echo "$UNFORMATTED"
            exit 1
          fi

      - name: Go Vet
        run: go vet ./...

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v7
        with:
          version: v2.14.0
          args: --timeout=5m

  build:
    name: Build All
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.27.1'
          cache: true

      - name: Install LLVM/Clang & eBPF headers
        run: |
          sudo apt-get update -q
          sudo apt-get install -y clang llvm libbpf-dev linux-headers-$(uname -r) || \
          sudo apt-get install -y clang llvm libbpf-dev linux-headers-generic

      - name: Build eBPF objects
        run: |
          make build-bpf
          make build-bpf-roce

      - name: Build all Go binaries
        run: make build

  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: [lint, build]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.27.1'
          cache: true

      - name: Run unit tests with race detector
        run: go test -v -race -count=1 -timeout=5m ./pkg/... ./internal/...

      - name: Run AIOps unit tests
        run: make test-aiops

      - name: Run RoCEv2 unit tests
        run: make test-roce

      - name: Run fuzz unit tests (no BPF required)
        run: make fuzz-unit

  helm-lint:
    name: Helm Chart Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: latest

      - name: Lint Helm chart
        run: helm lint charts/straitgateway --strict

      - name: Helm template smoke test
        run: |
          helm template straitgateway charts/straitgateway \
            --set global.imageRegistry="" \
            --debug \
            > /dev/null
