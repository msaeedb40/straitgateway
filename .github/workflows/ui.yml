name: UI

on:
  push:
    branches: [main, works]
    paths:
      - 'ui/**'
      - '.github/workflows/ui.yml'
  pull_request:
    branches: [main, works]
    paths:
      - 'ui/**'
      - '.github/workflows/ui.yml'

defaults:
  run:
    working-directory: ui

jobs:
  # ─────────────────────────────────────────────────────────────
  # Job 1: Lint (oxlint) + Type-check (tsc --noEmit)
  # ─────────────────────────────────────────────────────────────
  lint-typecheck:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: ui/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run oxlint
        run: npm run lint

      - name: TypeScript type check
        run: npx tsc --noEmit --project tsconfig.app.json

  # ─────────────────────────────────────────────────────────────
  # Job 2: Production build (tsc -b && vite build)
  # ─────────────────────────────────────────────────────────────
  build:
    name: Build
    runs-on: ubuntu-latest
    needs: lint-typecheck
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: ui/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build production bundle
        run: npm run build
        env:
          NODE_ENV: production

      - name: Check bundle size
        run: |
          echo "=== dist/ contents ==="
          find dist -type f | sort
          echo ""
          echo "=== Bundle sizes ==="
          du -sh dist/assets/*.js dist/assets/*.css 2>/dev/null || du -sh dist/assets/*

      - name: Upload dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: ui-dist
          path: ui/dist/
          retention-days: 7

  # ─────────────────────────────────────────────────────────────
  # Job 3: Dependency audit (npm audit)
  # ─────────────────────────────────────────────────────────────
  audit:
    name: Dependency Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: ui/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run npm audit (high + critical only)
        run: npm audit --audit-level=high --omit=dev
        continue-on-error: true  # report but don't block; govulncheck covers Go side
