name: Bug Report
description: Report a bug or unexpected behavior in StraitGateway
title: '[Bug]: '
labels: ['bug', 'triage']
assignees: []

body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug. Please fill in the details below to help us investigate.

  - type: checkboxes
    id: preflight
    attributes:
      label: Pre-flight checklist
      options:
        - label: I have searched for existing issues before filing this one
          required: true
        - label: I am running the latest version of StraitGateway
          required: true

  - type: dropdown
    id: component
    attributes:
      label: Affected component
      multiple: true
      options:
        - straitd (data plane daemon)
        - sg-controller (Kubernetes controller)
        - sg-cni (CNI plugin)
        - sg-agent (node agent)
        - sgctl (CLI)
        - eBPF programs (BPF/XDP/TC)
        - RoCEv2 / RDMA dataplane
        - AIOps / Observability
        - Helm charts / Deploy
        - Documentation
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: StraitGateway version
      placeholder: e.g. v1.2.0 or git sha
    validations:
      required: true

  - type: input
    id: kernel
    attributes:
      label: Linux kernel version
      placeholder: e.g. 6.8.0-45-generic (uname -r)
    validations:
      required: true

  - type: input
    id: k8s-version
    attributes:
      label: Kubernetes version
      placeholder: e.g. v1.32.2

  - type: textarea
    id: description
    attributes:
      label: Describe the bug
      description: A clear description of what the bug is and when it occurs.
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: Steps to reproduce the behavior.
      placeholder: |
        1. Deploy StraitGateway with config '...'
        2. Apply manifest '...'
        3. Observe '...'
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: What actually happened? Include logs, errors, or stack traces.

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Any other relevant environment info (CNI, cloud provider, NIC, etc.)
      placeholder: |
        - Cloud: bare-metal / AWS / GCP / Azure
        - NIC: Mellanox ConnectX-6 / Intel E810
        - Container runtime: containerd 1.7.x
        - CNI mode: XDP / TC / netkit
