apiVersion: v1
kind: ConfigMap
metadata:
  name: straitgateway-config
  namespace: straitgateway-system
  labels:
    app.kubernetes.io/name: straitgateway
data:
  config.yaml: |
    logLevel: info
    bpfFsPath: /sys/fs/bpf
    cniBinDir: /opt/cni/bin
    cniConfDir: /etc/cni/net.d
    clusterCIDR: 10.244.0.0/16
    serviceCIDR: 10.96.0.0/12
    transitASN: 65001
    wireguardPort: 51820
    bfdEnabled: true
    bfdMinRxInterval: 50ms
    bfdMinTxInterval: 50ms
    bfdDetectMultiplier: 3
    metricsBindAddr: ":9090"
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: straitgateway-agent
  namespace: straitgateway-system
  labels:
    app.kubernetes.io/name: straitgateway
    app.kubernetes.io/component: agent
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: straitgateway
      app.kubernetes.io/component: agent
  template:
    metadata:
      labels:
        app.kubernetes.io/name: straitgateway
        app.kubernetes.io/component: agent
    spec:
      hostNetwork: true
      hostPID: true
      serviceAccountName: straitgateway-agent
      tolerations:
        - operator: Exists
          effect: NoSchedule
        - operator: Exists
          effect: NoExecute
      containers:
        - name: agent
          image: straitgateway/sg-agent:v1.0.0
          imagePullPolicy: IfNotPresent
          command:
            - /usr/local/bin/sg-agent
          args:
            - --config=/etc/straitgateway/config.yaml
          securityContext:
            privileged: true
            capabilities:
              add:
                - BPF
                - NET_ADMIN
                - SYS_ADMIN
                - NET_RAW
                - SYS_RESOURCE
          ports:
            - name: metrics
              containerPort: 9090
              protocol: TCP
            - name: wireguard
              containerPort: 51820
              protocol: UDP
            - name: bfd
              containerPort: 3784
              protocol: UDP
            - name: bgp
              containerPort: 179
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /healthz
              port: metrics
            initialDelaySeconds: 15
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /healthz
              port: metrics
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 1000m
              memory: 1024Mi
          volumeMounts:
            - name: bpf-maps
              mountPath: /sys/fs/bpf
              mountPropagation: Bidirectional
            - name: config
              mountPath: /etc/straitgateway
              readOnly: true
            - name: run-dir
              mountPath: /var/run/straitgateway
            - name: lib-modules
              mountPath: /lib/modules
              readOnly: true
            - name: sys-kernel
              mountPath: /sys/kernel/debug
              mountPropagation: HostToContainer
      volumes:
        - name: bpf-maps
          hostPath:
            path: /sys/fs/bpf
            type: DirectoryOrCreate
        - name: config
          configMap:
            name: straitgateway-config
        - name: run-dir
          hostPath:
            path: /var/run/straitgateway
            type: DirectoryOrCreate
        - name: lib-modules
          hostPath:
            path: /lib/modules
        - name: sys-kernel
          hostPath:
            path: /sys/kernel/debug
---
apiVersion: v1
kind: Service
metadata:
  name: straitgateway-metrics
  namespace: straitgateway-system
  labels:
    app.kubernetes.io/name: straitgateway
    app.kubernetes.io/component: observability
spec:
  type: ClusterIP
  ports:
    - name: metrics
      port: 9090
      targetPort: metrics
      protocol: TCP
  selector:
    app.kubernetes.io/name: straitgateway
    app.kubernetes.io/component: agent
