apiVersion: v1
kind: ServiceAccount
metadata:
  name: straitgateway-agent
  namespace: straitgateway-system
  labels:
    app.kubernetes.io/name: straitgateway
    app.kubernetes.io/component: agent
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: straitgateway-controller
  namespace: straitgateway-system
  labels:
    app.kubernetes.io/name: straitgateway
    app.kubernetes.io/component: controller
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: straitgateway-agent
  labels:
    app.kubernetes.io/name: straitgateway
rules:
  - apiGroups: [""]
    resources:
      - nodes
      - nodes/status
      - pods
      - pods/status
      - namespaces
      - services
      - endpoints
      - configmaps
    verbs: ["get", "list", "watch"]
  - apiGroups: ["discovery.k8s.io"]
    resources:
      - endpointslices
    verbs: ["get", "list", "watch"]
  - apiGroups: ["straitgateway.io"]
    resources:
      - straitgatewayconfigs
      - transitgateways
      - gatewaypeers
      - transitroutes
      - securitypolicies
      - servicemeshpolicies
      - straitgatewayconfigs/status
      - transitgateways/status
      - gatewaypeers/status
      - transitroutes/status
      - securitypolicies/status
      - servicemeshpolicies/status
    verbs: ["get", "list", "watch", "update", "patch"]
  - apiGroups: [""]
    resources:
      - events
    verbs: ["create", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: straitgateway-agent
  labels:
    app.kubernetes.io/name: straitgateway
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: straitgateway-agent
subjects:
  - kind: ServiceAccount
    name: straitgateway-agent
    namespace: straitgateway-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: straitgateway-controller
  labels:
    app.kubernetes.io/name: straitgateway
rules:
  - apiGroups: [""]
    resources:
      - nodes
      - pods
      - services
      - endpoints
      - namespaces
    verbs: ["get", "list", "watch"]
  - apiGroups: ["discovery.k8s.io"]
    resources:
      - endpointslices
    verbs: ["get", "list", "watch"]
  - apiGroups: ["straitgateway.io"]
    resources:
      - straitgatewayconfigs
      - transitgateways
      - gatewaypeers
      - transitroutes
      - securitypolicies
      - servicemeshpolicies
      - straitgatewayconfigs/status
      - transitgateways/status
      - gatewaypeers/status
      - transitroutes/status
      - securitypolicies/status
      - servicemeshpolicies/status
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["coordination.k8s.io"]
    resources:
      - leases
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: [""]
    resources:
      - events
    verbs: ["create", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: straitgateway-controller
  labels:
    app.kubernetes.io/name: straitgateway
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: straitgateway-controller
subjects:
  - kind: ServiceAccount
    name: straitgateway-controller
    namespace: straitgateway-system
