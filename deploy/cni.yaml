apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: straitgateway-cni
  namespace: straitgateway-system
  labels:
    app.kubernetes.io/name: straitgateway
    app.kubernetes.io/component: cni
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: straitgateway
      app.kubernetes.io/component: cni
  template:
    metadata:
      labels:
        app.kubernetes.io/name: straitgateway
        app.kubernetes.io/component: cni
    spec:
      hostNetwork: true
      tolerations:
        - operator: Exists
          effect: NoSchedule
      initContainers:
        - name: install-cni
          image: straitgateway/sg-cni:v1.0.0
          imagePullPolicy: IfNotPresent
          command:
            - /bin/sh
            - -c
            - |
              set -e
              echo "Installing StraitGateway CNI binary to host /opt/cni/bin..."
              cp -f /usr/local/bin/sg-cni /host/opt/cni/bin/straitgateway
              chmod +x /host/opt/cni/bin/straitgateway
              
              echo "Generating 10-straitgateway.conflist in /etc/cni/net.d..."
              cat <<EOF > /host/etc/cni/net.d/10-straitgateway.conflist
              {
                "cniVersion": "0.4.0",
                "name": "straitgateway-net",
                "plugins": [
                  {
                    "type": "straitgateway",
                    "mode": "l3",
                    "ipam": {
                      "type": "host-local",
                      "subnet": "10.244.0.0/16"
                    }
                  },
                  {
                    "type": "portmap",
                    "capabilities": {"portMappings": true}
                  }
                ]
              }
              EOF
              echo "CNI plugin install completed successfully."
          volumeMounts:
            - name: cni-bin
              mountPath: /host/opt/cni/bin
            - name: cni-net-d
              mountPath: /host/etc/cni/net.d
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 64Mi
      containers:
        - name: cni-watcher
          image: straitgateway/sg-cni:v1.0.0
          imagePullPolicy: IfNotPresent
          command:
            - /bin/sh
            - -c
            - |
              trap 'exit 0' SIGTERM
              while true; do
                if [ ! -f /host/opt/cni/bin/straitgateway ]; then
                  echo "Restoring missing CNI binary..."
                  cp -f /usr/local/bin/sg-cni /host/opt/cni/bin/straitgateway
                  chmod +x /host/opt/cni/bin/straitgateway
                fi
                sleep 60
              done
          volumeMounts:
            - name: cni-bin
              mountPath: /host/opt/cni/bin
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 64Mi
      volumes:
        - name: cni-bin
          hostPath:
            path: /opt/cni/bin
            type: DirectoryOrCreate
        - name: cni-net-d
          hostPath:
            path: /etc/cni/net.d
            type: DirectoryOrCreate
