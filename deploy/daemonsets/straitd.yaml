---
# Source: straitgateway/templates/daemonsets/straitd.yaml
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: straitd
  namespace: kube-system
  labels:
    app.kubernetes.io/name: straitd
    app.kubernetes.io/part-of: straitgateway
    app.kubernetes.io/version: 1.0.0
spec:
  selector:
    matchLabels:
      app: straitd
  updateStrategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
  template:
    metadata:
      labels:
        app: straitd
        app.kubernetes.io/name: straitd
        app.kubernetes.io/part-of: straitgateway
    spec:
      hostNetwork: true
      hostPID: true
      priorityClassName: system-node-critical
      tolerations:
        - operator: Exists
          effect: NoSchedule
        - operator: Exists
          effect: NoExecute
      initContainers:
        # CNI binary installer
        - name: install-cni
          image: ghcr.io/straitgateway/straitd:1.0.0
          imagePullPolicy: IfNotPresent
          command: ["/bin/sh", "-c"]
          args:
            - |
              cp /usr/local/bin/strait-cni /opt/cni/bin/strait-cni
              chmod +x /opt/cni/bin/strait-cni
              cp /etc/straitgateway/straitgateway.conflist /etc/cni/net.d/straitgateway.conflist
              echo "CNI plugin installed"
          volumeMounts:
            - name: cni-bin
              mountPath: /opt/cni/bin
            - name: cni-conf
              mountPath: /etc/cni/net.d
      containers:
        - name: straitd
          image: ghcr.io/straitgateway/straitd:1.0.0
          imagePullPolicy: IfNotPresent
          securityContext:
            capabilities:
              add:
              - NET_ADMIN
              - SYS_ADMIN
              - NET_RAW
              - BPF
              - PERFMON
              drop:
              - ALL
            privileged: false
          resources:
            limits:
              cpu: "1"
              memory: 512Mi
            requests:
              cpu: 200m
              memory: 256Mi
          volumeMounts:
            - name: bpffs
              mountPath: /sys/fs/bpf
              mountPropagation: Bidirectional
            - name: debugfs
              mountPath: /sys/kernel/debug
            - name: cgroup
              mountPath: /sys/fs/cgroup
              mountPropagation: Bidirectional
            - name: straitd-run
              mountPath: /run/straitd
      volumes:
        - name: bpffs
          hostPath:
            path: /sys/fs/bpf
            type: DirectoryOrCreate
        - name: debugfs
          hostPath:
            path: /sys/kernel/debug
            type: Directory
        - name: cgroup
          hostPath:
            path: /sys/fs/cgroup
            type: Directory
        - name: cni-bin
          hostPath:
            path: /opt/cni/bin
            type: DirectoryOrCreate
        - name: cni-conf
          hostPath:
            path: /etc/cni/net.d
            type: DirectoryOrCreate
        - name: straitd-run
          hostPath:
            path: /run/straitd
            type: DirectoryOrCreate
