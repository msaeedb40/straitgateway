apiVersion: apps/v1
kind: Deployment
metadata:
  name: straitgateway-controller
  namespace: straitgateway-system
  labels:
    app.kubernetes.io/name: straitgateway
    app.kubernetes.io/component: controller
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: straitgateway
      app.kubernetes.io/component: controller
  template:
    metadata:
      labels:
        app.kubernetes.io/name: straitgateway
        app.kubernetes.io/component: controller
    spec:
      serviceAccountName: straitgateway-controller
      containers:
        - name: controller
          image: straitgateway/sg-controller:v1.0.0
          imagePullPolicy: IfNotPresent
          command:
            - /usr/local/bin/sg-controller
          args:
            - --leader-elect=true
            - --sync-period=30s
          env:
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 512Mi
