apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: straitgateway-controller
  labels:
    app.kubernetes.io/name: straitgateway
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: straitgateway-controller
subjects:
  - kind: ServiceAccount
    name: straitgateway-controller
    namespace: straitgateway-system
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: straitgateway-controller
  namespace: straitgateway-system
  labels:
    app.kubernetes.io/name: straitgateway
    app.kubernetes.io/component: controller
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: straitgateway
      app.kubernetes.io/component: controller
  template:
    metadata:
      labels:
        app.kubernetes.io/name: straitgateway
        app.kubernetes.io/component: controller
    spec:
      serviceAccountName: straitgateway-controller
      containers:
        - name: controller
          image: straitgateway/sg-controller:v1.0.0
          imagePullPolicy: IfNotPresent
          command:
            - /usr/local/bin/sg-controller
          args:
            - --leader-elect=true
            - --sync-period=30s
          env:
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 512Mi
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: straitgateway-config
  namespace: straitgateway-system
  labels:
    app.kubernetes.io/name: straitgateway
data:
  config.yaml: |
    logLevel: info
    bpfFsPath: /sys/fs/bpf
    cniBinDir: /opt/cni/bin
    cniConfDir: /etc/cni/net.d
    clusterCIDR: 10.244.0.0/16
    serviceCIDR: 10.96.0.0/12
    transitASN: 65001
    wireguardPort: 51820
    bfdEnabled: true
    bfdMinRxInterval: 50ms
    bfdMinTxInterval: 50ms
    bfdDetectMultiplier: 3
    metricsBindAddr: ":9090"
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: straitgateway-agent
  namespace: straitgateway-system
  labels:
    app.kubernetes.io/name: straitgateway
    app.kubernetes.io/component: agent
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: straitgateway
      app.kubernetes.io/component: agent
  template:
    metadata:
      labels:
        app.kubernetes.io/name: straitgateway
        app.kubernetes.io/component: agent
    spec:
      hostNetwork: true
      hostPID: true
      serviceAccountName: straitgateway-agent
      tolerations:
        - operator: Exists
          effect: NoSchedule
        - operator: Exists
          effect: NoExecute
      containers:
        - name: agent
          image: straitgateway/sg-agent:v1.0.0
          imagePullPolicy: IfNotPresent
          command:
            - /usr/local/bin/sg-agent
          args:
            - --config=/etc/straitgateway/config.yaml
          securityContext:
            privileged: true
            capabilities:
              add:
                - BPF
                - NET_ADMIN
                - SYS_ADMIN
                - NET_RAW
                - SYS_RESOURCE
          ports:
            - name: metrics
              containerPort: 9090
              protocol: TCP
            - name: wireguard
              containerPort: 51820
              protocol: UDP
            - name: bfd
              containerPort: 3784
              protocol: UDP
            - name: bgp
              containerPort: 179
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /healthz
              port: metrics
            initialDelaySeconds: 15
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /readyz
              port: metrics
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 1000m
              memory: 1024Mi
          volumeMounts:
            - name: bpf-maps
              mountPath: /sys/fs/bpf
              mountPropagation: Bidirectional
            - name: config
              mountPath: /etc/straitgateway
              readOnly: true
            - name: run-dir
              mountPath: /var/run/straitgateway
            - name: lib-modules
              mountPath: /lib/modules
              readOnly: true
            - name: sys-kernel
              mountPath: /sys/kernel/debug
              mountPropagation: HostToContainer
      volumes:
        - name: bpf-maps
          hostPath:
            path: /sys/fs/bpf
            type: DirectoryOrCreate
        - name: config
          configMap:
            name: straitgateway-config
        - name: run-dir
          hostPath:
            path: /var/run/straitgateway
            type: DirectoryOrCreate
        - name: lib-modules
          hostPath:
            path: /lib/modules
        - name: sys-kernel
          hostPath:
            path: /sys/kernel/debug
---
apiVersion: v1
kind: Service
metadata:
  name: straitgateway-metrics
  namespace: straitgateway-system
  labels:
    app.kubernetes.io/name: straitgateway
    app.kubernetes.io/component: observability
spec:
  type: ClusterIP
  ports:
    - name: metrics
      port: 9090
      targetPort: metrics
      protocol: TCP
  selector:
    app.kubernetes.io/name: straitgateway
    app.kubernetes.io/component: agent
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: straitgateway-cni
  namespace: straitgateway-system
  labels:
    app.kubernetes.io/name: straitgateway
    app.kubernetes.io/component: cni
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: straitgateway
      app.kubernetes.io/component: cni
  template:
    metadata:
      labels:
        app.kubernetes.io/name: straitgateway
        app.kubernetes.io/component: cni
    spec:
      hostNetwork: true
      tolerations:
        - operator: Exists
          effect: NoSchedule
      initContainers:
        - name: install-cni
          image: straitgateway/sg-cni:v1.0.0
          imagePullPolicy: IfNotPresent
          command:
            - /bin/sh
            - -c
            - |
              set -e
              BIN_SRC="/usr/local/bin/sg-cni"
              [ ! -f "$BIN_SRC" ] && BIN_SRC="/opt/cni/bin/sg-cni"
              cp -f "$BIN_SRC" /host/opt/cni/bin/straitgateway
              chmod +x /host/opt/cni/bin/straitgateway
              
              echo "Generating 10-straitgateway.conflist in /etc/cni/net.d..."
              cat <<EOF > /host/etc/cni/net.d/10-straitgateway.conflist
              {
                "cniVersion": "0.4.0",
                "name": "straitgateway-net",
                "plugins": [
                  {
                    "type": "straitgateway",
                    "mode": "l3",
                    "ipam": {
                      "type": "host-local",
                      "subnet": "10.244.0.0/16"
                    }
                  },
                  {
                    "type": "portmap",
                    "capabilities": {"portMappings": true}
                  }
                ]
              }
              EOF
              echo "CNI plugin install completed successfully."
          volumeMounts:
            - name: cni-bin
              mountPath: /host/opt/cni/bin
            - name: cni-net-d
              mountPath: /host/etc/cni/net.d
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 64Mi
      containers:
        - name: cni-watcher
          image: straitgateway/sg-cni:v1.0.0
          imagePullPolicy: IfNotPresent
          command:
            - /bin/sh
            - -c
            - |
              trap 'exit 0' SIGTERM
              BIN_SRC="/usr/local/bin/sg-cni"
              [ ! -f "$BIN_SRC" ] && BIN_SRC="/opt/cni/bin/sg-cni"
              while true; do
                if [ ! -f /host/opt/cni/bin/straitgateway ]; then
                  echo "Restoring missing CNI binary..."
                  cp -f "$BIN_SRC" /host/opt/cni/bin/straitgateway
                  chmod +x /host/opt/cni/bin/straitgateway
                fi
                sleep 60
              done
          volumeMounts:
            - name: cni-bin
              mountPath: /host/opt/cni/bin
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 64Mi
      volumes:
        - name: cni-bin
          hostPath:
            path: /opt/cni/bin
            type: DirectoryOrCreate
        - name: cni-net-d
          hostPath:
            path: /etc/cni/net.d
            type: DirectoryOrCreate
---
