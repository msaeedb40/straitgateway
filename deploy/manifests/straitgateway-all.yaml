# Source: straitgateway/templates/config/configmap.yaml
apiVersion: v1
kind: ConfigMap
metadata:
  name: straitgateway-config
  namespace: kube-system
  labels:
    app.kubernetes.io/name: straitgateway-config
    app.kubernetes.io/part-of: straitgateway
data:
