# Source: straitgateway/templates/rbac/controller-rbac.yaml
# sg-controller ClusterRole
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: sg-controller
  labels:
    app.kubernetes.io/part-of: straitgateway
rules:
  # Core resources
  - apiGroups: [""]
    resources: ["nodes", "pods", "services", "endpoints", "namespaces"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["create", "patch"]
  # EndpointSlices
  - apiGroups: ["discovery.k8s.io"]
    resources: ["endpointslices"]
    verbs: ["get", "list", "watch"]
  # Gateway API
  - apiGroups: ["gateway.networking.k8s.io"]
    resources:
      ["gateways", "httproutes", "grpcroutes", "tcproutes","tlsroutes","udproutes", "referencegrants"]
    verbs: ["get", "list", "watch", "update", "patch"]
  - apiGroups: ["gateway.networking.k8s.io"]
    resources:
      ["gateways/status", "httproutes/status", "grpcroutes/status", "tcproutes/status", "tlsroutes/status","udproutes/status"]
    verbs: ["update", "patch"]
  # StraitGateway CRDs
  - apiGroups: ["straitgateway.io"]
    resources: ["*"]
    verbs: ["*"] 
  # Leader election
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["get", "create", "update", "patch"]
